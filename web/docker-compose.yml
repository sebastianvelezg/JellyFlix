# Jellyflix Web. From this folder:   docker compose up -d --build
# Then open  http://<IP address of this machine>:8080   (full guide: the "Host it" section of web/README.md)
#
# Optional settings go in a file called .env next to this one (copy .env.example):
#   JELLYFIN_URL    the address your Jellyfin server has for your browser, e.g. http://YOUR-JELLYFIN-IP:8096. It only pre-fills the sign-in screen.
#   JELLYFLIX_PORT  the port Jellyflix is served on (default 8080)
services:
  jellyflix-web:
    build: .
    image: jellyflix-web:latest
    container_name: jellyflix-web
    restart: unless-stopped
    ports:
      - "${JELLYFLIX_PORT:-8080}:80"
    environment:
      JELLYFIN_URL: "${JELLYFIN_URL:-}"
      # Optional, empty by default: the extra modules container (see ../modules/README.md).
      JELLYFLIX_MODULES_URL: "${JELLYFLIX_MODULES_URL:-}"
      JELLYFLIX_MODULES_PUBLIC_URL: "${JELLYFLIX_MODULES_PUBLIC_URL:-}"
      # Optional: 1 lets the page reach only this site, JELLYFIN_URL and the modules container (see "Host it" in README.md).
      JELLYFLIX_STRICT_CSP: "${JELLYFLIX_STRICT_CSP:-}"
    # It only serves files, so it is given as little as it can work with: a read-only disk (the few folders nginx writes to are in memory),
    # no extra privileges, and only the four capabilities nginx's start needs (port 80, then drop to its own user).
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
