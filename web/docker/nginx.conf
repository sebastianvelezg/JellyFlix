# Serves the built app. The app is a static single-page app with its routes after the "#", so no rewrite rules are needed.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not tell which version of nginx this is, and nothing here takes a request body.
    server_tokens off;
    client_max_body_size 1k;

    # The web manifest is not in nginx's default list of types; the PDF reader's worker (.mjs) and decoders (.wasm) must have these ones.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
        text/javascript mjs;
        application/wasm wasm;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json application/wasm image/svg+xml;

    # Security headers (one file; see it for why it is included again below).
    include /etc/nginx/snippets/security-headers.conf;

    # Built files carry a hash of their content in the name: keep them for good.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        limit_except GET { deny all; }
    }

    # The address the sign-in screen starts with. The container writes it when it starts (see 40-runtime-config.sh), to a folder in /tmp
    # rather than next to the app, so the app's own files can stay read-only.
    location = /config.js {
        alias /tmp/jellyflix/config.js;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        limit_except GET { deny all; }
    }

    # Everything else (the page, the service worker, the manifest) is asked again each time, so a new version shows at once.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
