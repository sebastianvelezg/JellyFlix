name: Release

# Push a tag such as v1.0.0 to build the web bundle, the Docker image and the TV APK, and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - name: Zip the build
        run: cd web/dist && zip -r "../../jellyflix-web-${GITHUB_REF_NAME}.zip" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web
          path: jellyflix-web-*.zip

  docker:
    name: Docker image (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Image name in lower case
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jellyflix-web" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          push: true
          # Signed statements of how the image was built and what is inside it, stored next to it in the registry.
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  tv:
    name: TV APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Use the release key (a release is never built without it)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # An APK signed with another key cannot update the one already installed, so a missing secret stops the release
          # instead of publishing a build nobody could update to.
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret for $name is missing: not publishing a TV APK signed with the debug key."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > tv/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > tv/keystore.properties
          echo "Signing with the release key."
      - run: chmod +x gradlew && ./gradlew --no-daemon :app:assembleRelease
        working-directory: tv
      - name: Name the APK, and write its SHA-256 next to it
        run: |
          cp tv/app/build/outputs/apk/release/app-release.apk "jellyflix-tv-${GITHUB_REF_NAME}.apk"
          sha256sum "jellyflix-tv-${GITHUB_REF_NAME}.apk" > "jellyflix-tv-${GITHUB_REF_NAME}.apk.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tv
          path: |
            jellyflix-tv-*.apk
            jellyflix-tv-*.apk.sha256

  release:
    name: GitHub release
    needs: [web, docker, tv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only our two artifacts: the Docker build also leaves a build-record artifact that must not be downloaded.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web
          path: assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tv
          path: assets
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: assets/*
          generate_release_notes: true
