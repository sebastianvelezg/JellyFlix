name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  web-docker:
    name: Web (Docker image builds and serves)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t jellyflix-web:ci web
      - name: Start it and check it answers
        run: |
          docker run -d --name jf -p 8080:80 -e JELLYFIN_URL=http://jellyfin.local:8096 jellyflix-web:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q "<title>Jellyflix</title>"
          curl -fsS http://127.0.0.1:8080/config.js | grep -q "jellyfin.local:8096"

  tv:
    name: TV (unit tests, debug build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
